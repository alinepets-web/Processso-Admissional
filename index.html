<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checklist de Admissão</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    background: #f4f5f7;
    margin: 0;
    padding: 24px;
    color: #1f2430;
  }
  .container { max-width: 1200px; margin: 0 auto; }
  h1 { font-size: 22px; margin-bottom: 4px; }
  .subtitle { color: #666; margin-bottom: 20px; font-size: 14px; }
  .toolbar { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
  button {
    background: #2f6feb; color: #fff; border: none; padding: 9px 16px;
    border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 600;
  }
  button.secondary { background: #ffffff; color: #2f6feb; border: 1px solid #2f6feb; }
  button.danger { background: #ffffff; color: #d64545; border: 1px solid #d64545; }
  .table-wrap { overflow-x: auto; background: #fff; border-radius: 10px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
  table { border-collapse: collapse; width: 100%; min-width: 900px; }
  th, td { border-bottom: 1px solid #e8e8e8; padding: 10px 8px; text-align: center; font-size: 13px; }
  th { background: #1f2430; color: #fff; position: sticky; top: 0; font-weight: 600; white-space: nowrap; }
  .name-col { text-align: left; font-weight: 600; white-space: nowrap; padding-left: 14px; }
  td.cell { cursor: pointer; min-width: 90px; color: #999; transition: background 0.15s; }
  td.cell:hover { background: #f0f4ff; }
  td.cell.done { background: #e5f7ea; color: #1e7d3a; font-weight: 600; }
  td.cell .date { font-size: 10px; color: #4c9a63; font-weight: 400; }
  .progress-cell { min-width: 110px; }
  .bar { background: #eee; border-radius: 6px; height: 8px; width: 90px; margin: 0 auto 4px; overflow: hidden; }
  .fill { background: #2f6feb; height: 100%; }
  .pct { font-size: 11px; color: #555; }
  .del { background: transparent; color: #d64545; border: none; font-size: 14px; padding: 4px 8px; }
  .legend { font-size: 12px; color: #666; margin-top: 14px; line-height: 1.6; }
  .legend b { color: #333; }
  .authbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
  .authbar .userinfo { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #333; }
  .authbar .userinfo img { width: 24px; height: 24px; border-radius: 50%; }
  .badge { font-size: 11px; padding: 3px 8px; border-radius: 20px; font-weight: 600; }
  .badge.editor { background: #e5f7ea; color: #1e7d3a; }
  .badge.viewer { background: #eef1f6; color: #556; }
  button.google { background: #fff; color: #444; border: 1px solid #d0d3da; }
  td.cell.readonly { cursor: default; }
  td.cell.readonly:hover { background: none; }
  .toolbar.hidden, .del.hidden { display: none !important; }
</style>
</head>
<body>
<div class="container">
  <h1>Checklist de Admissão</h1>
  <div class="subtitle" id="subtitleText">Clique em uma célula para marcar/desmarcar a etapa. A data é registrada automaticamente.</div>

  <div class="authbar">
    <div class="userinfo" id="userInfo">Carregando...</div>
    <div>
      <button class="google" id="loginBtn" onclick="loginGoogle()" style="display:none;">Entrar com Google</button>
      <button class="secondary" id="logoutBtn" onclick="logout()" style="display:none;">Sair</button>
    </div>
  </div>

  <div class="toolbar" id="editToolbar" style="display:none;">
    <button onclick="addEmployee()">+ Novo colaborador</button>
    <button class="secondary" onclick="exportCSV()">Exportar CSV</button>
    <button class="danger" onclick="if(confirm('Isso vai apagar todos os dados salvos e voltar ao estado inicial. Continuar?')) resetAll()">Restaurar padrão</button>
  </div>
  <div class="toolbar" id="viewToolbar">
    <button class="secondary" onclick="exportCSV()">Exportar CSV</button>
  </div>

  <div class="table-wrap">
    <table>
      <thead><tr id="headerRow"></tr></thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

  <div class="legend" id="legend"></div>
</div>

<!-- Firebase (Auth + Firestore) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
/* ====== CONFIGURAÇÃO DO FIREBASE ======
   Substitua os valores abaixo pelos dados do SEU projeto Firebase.
   Onde encontrar: Console do Firebase > Configurações do projeto > Seus apps > SDK setup and configuration
*/
const firebaseConfig = {
  apiKey: "SUA_API_KEY",
  authDomain: "SEU_PROJETO.firebaseapp.com",
  projectId: "SEU_PROJETO",
  storageBucket: "SEU_PROJETO.appspot.com",
  messagingSenderId: "SEU_SENDER_ID",
  appId: "SEU_APP_ID"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
// Todos os dados ficam em um único documento compartilhado
const checklistDocRef = db.collection('checklistAdmissao').doc('main');
const auth = firebase.auth();
const googleProvider = new firebase.auth.GoogleAuthProvider();

// Único e-mail autorizado a editar (letras minúsculas)
const EDITOR_EMAIL = 'alinepets@gmail.com';

let currentUser = null;
let isEditor = false;

function loginGoogle(){
  auth.signInWithPopup(googleProvider).catch(err => {
    alert('Erro ao entrar: ' + err.message);
  });
}

function logout(){
  auth.signOut();
}

auth.onAuthStateChanged(user => {
  currentUser = user;
  isEditor = !!(user && user.email && user.email.toLowerCase() === EDITOR_EMAIL);
  updateAuthUI();
  render();
});

function updateAuthUI(){
  const userInfo = document.getElementById('userInfo');
  const loginBtn = document.getElementById('loginBtn');
  const logoutBtn = document.getElementById('logoutBtn');
  const subtitleText = document.getElementById('subtitleText');
  const editToolbar = document.getElementById('editToolbar');
  const viewToolbar = document.getElementById('viewToolbar');

  if(currentUser){
    const badge = isEditor
      ? '<span class="badge editor">Edição liberada</span>'
      : '<span class="badge viewer">Somente visualização</span>';
    userInfo.innerHTML = `<img src="${currentUser.photoURL||''}" onerror="this.style.display='none'"> ${currentUser.displayName||currentUser.email} ${badge}`;
    loginBtn.style.display = 'none';
    logoutBtn.style.display = 'inline-block';
  } else {
    userInfo.innerHTML = '<span class="badge viewer">Somente visualização</span> (não conectado)';
    loginBtn.style.display = 'inline-block';
    logoutBtn.style.display = 'none';
  }

  subtitleText.textContent = isEditor
    ? 'Clique em uma célula para marcar/desmarcar a etapa. A data é registrada automaticamente.'
    : 'Modo visualização — apenas alinepets@gmail.com pode editar este checklist.';

  editToolbar.style.display = isEditor ? 'flex' : 'none';
  viewToolbar.style.display = isEditor ? 'none' : 'flex';
}

const STORAGE_KEY = 'processoAdmissaoChecklist_v1';

const STEPS = [
  {key:'admissao',  label:'Admissão',          desc:'Envio da ficha de registro para contabilidade.'},
  {key:'bancodoc',  label:'Bancodoc',          desc:'Cadastro e envio da documentação admissional no sistema.'},
  {key:'direcao',   label:'Direção defensiva', desc:'Treinamento sobre práticas seguras de condução.'},
  {key:'quatro4',   label:'4x4',               desc:'Treinamento para operação de veículos 4x4.'},
  {key:'cracha',    label:'Crachá',            desc:'Solicitação e emissão do crachá de acesso.'},
  {key:'integracao',label:'Integração',        desc:'Apresentação da empresa, normas e cultura.'},
  {key:'subsolo',   label:'Subsolo',           desc:'Reconhecimento das instalações e orientações de segurança.'}
];

const DEFAULT_EMPLOYEES = [
  {name:'Helton', done:['subsolo']},
  {name:'Anthony', done:['subsolo']},
  {name:'José Fausto', done:['subsolo']},
  {name:'Marlon', done:['subsolo']},
  {name:'Isaque', done:['subsolo']},
  {name:'Josemalson', done:['subsolo']},
  {name:'Wagner', done:['integracao']},
  {name:'Leonardo', done:[]},
  {name:'Gregory', done:[]},
  {name:'Kennedy', done:[]},
  {name:'Marcu Tulio', done:[]},
  {name:'Thallisson', done:[]},
  {name:'Marcelo Ventura', done:[]}
];

let state = [];

function buildInitialData(){
  return DEFAULT_EMPLOYEES.map((e,i) => {
    const steps = {};
    STEPS.forEach(s => {
      steps[s.key] = e.done.includes(s.key)
        ? {done:true, date:'23/08/2026'}
        : {done:false, date:''};
    });
    return {id:'emp_'+i, name:e.name, steps};
  });
}

let isRemoteUpdate = false; // evita loop entre listener e save local

async function load(){
  const snap = await checklistDocRef.get();
  if(snap.exists && snap.data().employees){
    state = snap.data().employees;
  } else {
    state = buildInitialData();
    await save();
  }
}

async function save(){
  isRemoteUpdate = true;
  await checklistDocRef.set({ employees: state, updatedAt: new Date().toISOString() });
  isRemoteUpdate = false;
}

// Mantém todos os usuários sincronizados em tempo real
function listenForChanges(){
  checklistDocRef.onSnapshot(doc => {
    if(isRemoteUpdate) return; // ignora o eco da própria escrita
    if(doc.exists && doc.data().employees){
      state = doc.data().employees;
      render();
    }
  });
}

function todayBR(){
  const d = new Date();
  return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear();
}

async function toggleStep(empId, stepKey){
  if(!isEditor) return;
  const emp = state.find(e => e.id === empId);
  if(!emp) return;
  const cur = emp.steps[stepKey];
  cur.done ? (cur.done=false, cur.date='') : (cur.done=true, cur.date=todayBR());
  render();
  await save();
}

async function addEmployee(){
  if(!isEditor) return;
  const name = prompt('Nome do novo colaborador:');
  if(!name) return;
  const steps = {};
  STEPS.forEach(s => steps[s.key] = {done:false, date:''});
  state.push({id:'emp_'+Date.now(), name:name.trim(), steps});
  render();
  await save();
}

async function removeEmployee(empId){
  if(!isEditor) return;
  const emp = state.find(e => e.id === empId);
  if(!emp) return;
  if(!confirm('Remover "'+emp.name+'" do checklist?')) return;
  state = state.filter(e => e.id !== empId);
  render();
  await save();
}

function progressOf(emp){
  const done = STEPS.filter(s => emp.steps[s.key].done).length;
  return Math.round(done / STEPS.length * 100);
}

function exportCSV(){
  const rows = [['Colaborador', ...STEPS.map(s => s.label), 'Progresso']];
  state.forEach(emp => {
    const row = [emp.name];
    STEPS.forEach(s => {
      const st = emp.steps[s.key];
      row.push(st.done ? ('OK ('+st.date+')') : '');
    });
    row.push(progressOf(emp)+'%');
    rows.push(row);
  });
  const csv = rows.map(r => r.map(c => '"'+String(c).replace(/"/g,'""')+'"').join(';')).join('\n');
  const blob = new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'checklist_admissao.csv'; a.click();
  URL.revokeObjectURL(url);
}

async function resetAll(){
  if(!isEditor) return;
  state = buildInitialData();
  render();
  await save();
}

function render(){
  document.getElementById('headerRow').innerHTML =
    '<th class="name-col">Colaborador</th>' +
    STEPS.map(s => `<th title="${s.desc}">${s.label}</th>`).join('') +
    '<th>Progresso</th><th></th>';

  document.getElementById('tableBody').innerHTML = state.map(emp => {
    const pct = progressOf(emp);
    const cells = STEPS.map(s => {
      const st = emp.steps[s.key];
      const clickAttr = isEditor ? `onclick="toggleStep('${emp.id}','${s.key}')"` : '';
      const cls = 'cell ' + (st.done?'done ':'') + (isEditor?'':'readonly');
      return `<td class="${cls}" title="${s.desc}" ${clickAttr}>
        ${st.done ? '✔<br><span class="date">'+st.date+'</span>' : '—'}
      </td>`;
    }).join('');
    const delBtn = isEditor ? `<button class="del" onclick="removeEmployee('${emp.id}')">✕</button>` : '';
    return `<tr>
      <td class="name-col">${emp.name}</td>
      ${cells}
      <td class="progress-cell">
        <div class="bar"><div class="fill" style="width:${pct}%"></div></div>
        <span class="pct">${pct}%</span>
      </td>
      <td>${delBtn}</td>
    </tr>`;
  }).join('');

  document.getElementById('legend').innerHTML = STEPS.map(s =>
    `<b>${s.label}:</b> ${s.desc}`
  ).join('<br>');
}

window.onload = async () => {
  await load();
  render();
  listenForChanges();
};
</script>
</body>
</html>
